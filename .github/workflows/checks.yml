name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Export native production bundles
        run: pnpm exec expo export --platform all

  local-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      # This disposable runner owns the port and all synthetic data it creates.
      - run: pnpm db:up --port 55432
      - run: pnpm db:verify
      - run: pnpm db:test
      - run: pnpm activity:test:database
      - run: pnpm impact:test:database
      - run: pnpm participation:test:database
      - run: pnpm account:test:database
      - run: pnpm points:test:database
      - run: pnpm route:test:database
      - run: pnpm journey:test:database
      - run: pnpm awards:test:database
      - run: pnpm submissions:test:database
      - run: pnpm rewards:test:database
      - name: Build the pinned offline report parser
        run: |
          docker build --tag amr-report-parser:ci --iidfile "$RUNNER_TEMP/report-parser-image" -f services/api/reports/Dockerfile .
          echo "REPORT_PARSER_IMAGE=$(cat "$RUNNER_TEMP/report-parser-image")" >> "$GITHUB_ENV"
          node --input-type=module -e 'import {namespaceFor} from "./scripts/local-db.mjs"; import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV, "REPORT_TEST_STORAGE="+process.env.RUNNER_TEMP+"/"+namespaceFor(process.cwd())+"/test\n");'
      - run: pnpm reports:test:container
      - run: pnpm reports:test:database
      - name: Remove only the runner's report parser image
        if: always()
        run: docker image rm amr-report-parser:ci || test ! -f "$RUNNER_TEMP/report-parser-image"
      - name: Stop only this runner's database, preserving its volume until teardown
        if: always()
        run: pnpm db:stop
