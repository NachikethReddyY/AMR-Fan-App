name: Black Box smoke test

run-name: black-box-smoke:${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA of the trusted commit to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: black-box-smoke
  cancel-in-progress: false

jobs:
  award-policy:
    # Only the repository owner may dispatch code onto the persistent home PC.
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, linux, x64, black-box-linux]
    timeout-minutes: 10
    env:
      CI: 'true'
      EXPECTED_COMMIT: ${{ inputs.commit_sha }}
    steps:
      - name: Validate commit input
        shell: bash
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'commit_sha must be a full 40-character commit SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - name: Verify exact checkout
        shell: bash
        run: |
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "${EXPECTED_COMMIT,,}"
          printf 'Tested commit: %s\n' "$actual_commit" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Test journey award policy
        run: pnpm awards:test
