<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Points administration</title>
    <link rel="stylesheet" href="/admin/style.css" />
    <script type="module" src="/admin/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Points administration</h1>
        <button id="logout" hidden>Sign out</button>
      </header>
      <section id="signin" aria-labelledby="signin-title">
        <h2 id="signin-title">Sign in</h2>
        <p id="setup">Checking sign-in availability…</p>
        <form id="password-signin" hidden>
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            maxlength="254"
            required
          />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="1024"
            required
          />
          <button type="submit">Sign in</button>
        </form>
        <div id="fixtures" hidden>
          <p>
            Local test accounts. Admin access requires a server-assigned role.
          </p>
          <button data-fixture="fan-a">Use test account A</button>
          <button data-fixture="fan-b">Use test account B</button>
        </div>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="workspace" hidden>
        <form id="profile-form">
          <label for="profile">Account profile</label>
          <div class="profile-controls">
            <select id="profile" required></select
            ><button type="button" id="more-profiles" hidden>
              More profiles</button
            ><button>View History</button>
          </div>
        </form>
        <p id="balance" class="balance"></p>
        <form id="adjustment">
          <h2>Adjust points</h2>
          <label for="delta">Point change</label>
          <input
            id="delta"
            name="delta"
            type="number"
            step="1"
            min="-2147483647"
            max="2147483647"
            required
            aria-describedby="delta-help"
          />
          <p id="delta-help" class="muted">
            Use a positive whole number to add points or a negative number to
            remove them.
          </p>
          <label for="reason">Reason</label>
          <textarea
            id="reason"
            name="reason"
            maxlength="500"
            rows="2"
            required
          ></textarea>
          <button id="save" class="primary">Apply adjustment</button>
        </form>
        <section aria-labelledby="history-title">
          <h2 id="history-title">History</h2>
          <p id="empty" hidden>No point changes yet.</p>
          <ol id="history"></ol>
          <button id="more-history" hidden>Earlier changes</button>
        </section>
      </section>
    </main>
  </body>
</html>
