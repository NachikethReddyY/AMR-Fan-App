services:
  api:
    image: amr-fan-api:bb1
    build:
      context: ../..
      dockerfile: services/api/Dockerfile.api
    env_file:
      - .env
      - path: /home/bb-1/.auth/amr-onemap.env
        required: false
      - path: /home/bb-1/.auth/amr-ai.env
        required: false
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/amr-private/supabase-root-ca.pem
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - type: bind
        source: /home/bb-1/.auth
        target: /run/secrets/amr-private
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
