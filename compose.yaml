services:
  postgres:
    # PostgreSQL 17.11, multi-platform official image. Refresh deliberately.
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    ports:
      - '127.0.0.1:${AMR_DB_PORT:?Acquire a database port lease first}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    shm_size: 128mb
secrets:
  postgres_password:
    file: ${AMR_DB_PASSWORD_FILE:?Use pnpm db:up to supply the private password file}
volumes:
  postgres_data:
